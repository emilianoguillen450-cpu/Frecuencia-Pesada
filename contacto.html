<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frecuencia Pesada</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header>
        <h1>Frecuencia Pesada</h1>
        <p>El portal definitivo del Rock y el Metal</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="subgeneros.html">Subgéneros</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="contacto.html" class="active">Contacto</a>
    </nav>

    <section>
        <h2>Contacto y Reseñas</h2>
        <p>Envíanos tus opiniones, sugerencias o reseñas sobre la página para seguir mejorando el contenido.</p>
        <br>
        <form id="formulario-contacto">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" required placeholder="Tu nombre">

            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" required placeholder="tu@email.com">

            <label for="opinion">Tu Opinión o Reseña:</label>
            <textarea id="opinion" rows="5" required placeholder="Escribe tus comentarios aquí..."></textarea>

            <button type="submit">Enviar Opinión</button>
        </form>
    </section>

    <footer>
        <p>2026 Frecuencia Pesada - Rock y metal en un solo lugar.</p>
    </footer>

    <script>
        document.getElementById('formulario-contacto').addEventListener('submit', function(event) {
    event.preventDefault();
    
    const nombre = document.getElementById('nombre').value;
    alert('¡Muchas gracias por tu reseña, ' + nombre + '! Tu opinión ha sido enviada con éxito.');
    
    this.reset();
});
    </script>
</body>
</html>
